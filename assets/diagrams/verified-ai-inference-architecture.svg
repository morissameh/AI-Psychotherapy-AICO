    </g>
    <g transform="translate(266 164)">
      <rect width="196" height="208" rx="18" fill="#111e30" stroke="#2c4563"/>
      <rect width="196" height="6" rx="3" fill="#38bdf8"/>
      <circle cx="32" cy="40" r="17" fill="#0c4a6e"/>
      <text x="32" y="46" text-anchor="middle" fill="#7dd3fc" font-size="16" font-weight="700">02</text>
      <text x="22" y="98" fill="#f8fafc" font-size="21" font-weight="700">Prompt</text>
      <text x="22" y="126" fill="#f8fafc" font-size="21" font-weight="700">formatting</text>
      <text x="22" y="166" fill="#94a3b8" font-size="16">Role-labelled context</text>
