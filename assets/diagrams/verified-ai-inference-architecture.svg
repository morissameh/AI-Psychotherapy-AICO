      <text x="22" y="94" fill="#f8fafc" font-size="19" font-weight="700">Hugging Face</text>
      <text x="22" y="122" fill="#f8fafc" font-size="19" font-weight="700">generation</text>
      <text x="22" y="150" fill="#f8fafc" font-size="19" font-weight="700">pipeline</text>
      <text x="22" y="181" fill="#94a3b8" font-size="15">Text generation</text>
    </g>
    <g transform="translate(1356 164)">
      <rect width="196" height="208" rx="18" fill="#111e30" stroke="#2c4563"/>
      <rect width="196" height="6" rx="3" fill="#4ade80"/>
      <circle cx="32" cy="40" r="17" fill="#14532d"/>
