<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Verified AICO AI inference architecture</title>
  <desc id="desc">Seven-stage flow from user text through prompt formatting, LangChain conversational memory, Falcon-7B, a PEFT LoRA adapter, and the Hugging Face generation pipeline to a generated response.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1b2e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1600" height="520" rx="24" fill="url(#background)"/>
  <circle cx="1450" cy="30" r="190" fill="#2563eb" opacity="0.07"/>
  <circle cx="120" cy="510" r="180" fill="#14b8a6" opacity="0.05"/>

  <text x="48" y="64" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="32" font-weight="700">Verified AI inference path</text>
  <text x="48" y="101" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="18">Evidence-supported model flow reconstructed in the clean portfolio repository</text>

  <g fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)">
    <path d="M244 268 H258"/>
    <path d="M462 268 H476"/>
    <path d="M680 268 H694"/>
    <path d="M898 268 H912"/>
    <path d="M1116 268 H1130"/>
    <path d="M1334 268 H1348"/>
  </g>

