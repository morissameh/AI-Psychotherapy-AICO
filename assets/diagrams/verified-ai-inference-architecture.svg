  <g transform="translate(48 430)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="1504" height="50" rx="12" fill="#0e2035" stroke="#223b58"/>
    <circle cx="26" cy="25" r="6" fill="#38bdf8"/>
    <text x="44" y="31" fill="#cbd5e1" font-size="16">Verified scope: AI/LLM path only. Historical mobile, Flask, Firebase, and tunnel prototypes are not represented as integrated runtime components.</text>
