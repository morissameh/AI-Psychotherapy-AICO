      <text x="22" y="102" fill="#f8fafc" font-size="22" font-weight="700">PEFT / LoRA</text>
      <text x="22" y="134" fill="#f8fafc" font-size="22" font-weight="700">adapter</text>
      <text x="22" y="174" fill="#94a3b8" font-size="15">Local compatible artifact</text>
