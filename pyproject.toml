[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aico-research-prototype"
version = "0.1.0"
description = "Evidence-based reconstruction of the AICO Falcon-7B LoRA research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.28,<1",
  "bitsandbytes>=0.43,<1",
  "datasets>=2.18,<3",
  "langchain>=0.2,<0.3",
  "peft>=0.10,<1",
  "torch>=2.2.1,<3",
  "transformers>=4.39.3,<5",
  "trl>=0.8.6,<0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
